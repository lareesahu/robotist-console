<style>
:root{
  --bg-0:#030810;--bg-1:#060D18;--bg-2:#0C1828;--bg-3:#142035;--bg-4:#1E3550;
  --accent:#4AA8C8;--accent-dim:#2E8FB5;--accent-light:#A8DCEF;
  --accent-glow:rgba(74,168,200,0.12);
  --white:#F0F4F8;--grey-1:#8A9BB0;--grey-2:#4A5A6A;
  --font-main:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg-0);color:var(--white);font-family:var(--font-main);-webkit-font-smoothing:antialiased}

/* ══ CHATBOT CONTAINER — full page standalone ══ */
.chatbot-window{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;background:var(--bg-0)}
@media(min-width:768px){.chatbot-window{border-left:1px solid var(--bg-3);border-right:1px solid var(--bg-3)}}

/* HEADER */
.chatbot-header{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + var(--safe-top));background:var(--bg-1);border-bottom:1px solid var(--bg-3);min-height:52px;flex-shrink:0}
.chatbot-avatar{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg-2)}
.chatbot-header-info{flex:1;min-width:0}
.chatbot-name{font-size:14px;font-weight:600;color:var(--white);letter-spacing:.02em}
.chatbot-status{font-size:10px;color:var(--accent);letter-spacing:.04em}

/* MESSAGES */
.chatbot-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.msg{display:flex;gap:8px;max-width:88%;animation:slideIn .3s ease-out}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:none;background:var(--bg-2);align-items:center;justify-content:center}
.msg.bot .msg-avatar{display:flex}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;word-break:break-word}
.msg.user .msg-bubble{background:var(--accent);color:var(--bg-0);border-bottom-right-radius:4px;font-weight:500}
.msg.bot .msg-bubble{background:var(--bg-2);color:var(--white);border-bottom-left-radius:4px;border:1px solid var(--bg-4)}
.msg-time{font-size:9px;color: var(--grey-1);margin-top:3px}
.msg.user .msg-time{text-align:right}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* OPTIONS */
.msg-options{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg-option{padding:8px 14px;border-radius:16px;border:1px solid var(--accent-dim);background:var(--bg-3);color:var(--accent-light);font-size:12.5px;cursor:pointer;transition:all .18s;font-family:var(--font-main);white-space:nowrap}
.msg-option:hover,.msg-option:active{border-color:var(--accent);background:var(--accent-glow);color:var(--white)}

/* PRODUCT CARDS */
.msg-cards{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.robot-card{display:flex;gap:12px;padding:10px;border-radius:12px;background:var(--bg-2);border:1px solid var(--bg-4);cursor:pointer;transition:all .18s;text-decoration:none;align-items:center}
.robot-card:hover,.robot-card:active{border-color:var(--accent);background:var(--bg-3)}
.robot-card-img{width:64px;height:64px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg-3);display:flex;align-items:center;justify-content:center}
.robot-card-img img{width:100%;height:100%;object-fit:contain}
.robot-card-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.robot-card-name{font-size:13.5px;font-weight:600;color:var(--white)}
.robot-card-tags{display:flex;flex-wrap:wrap;gap:4px}
.robot-card-tag{font-size:9px;padding:2px 7px;border-radius:8px;background:var(--accent-glow);color:var(--accent-light);letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.robot-card-arrow{color:var(--accent);font-size:16px;flex-shrink:0;opacity:.6}

/* TYPING */
.typing-row{padding:4px 16px 8px;display:flex;align-items:center;gap:8px}
.chatbot-typing{display:flex;gap:4px;padding:10px 14px;border-radius:16px;background:var(--bg-2);border:1px solid var(--bg-4);border-bottom-left-radius:4px;width:fit-content}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dotBounce 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes dotBounce{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}

/* QUICK REPLIES */
.chatbot-quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 6px;justify-content:center}
.quick-reply-btn{padding:7px 14px;border-radius:16px;border:1px solid var(--bg-4);background:var(--bg-2);color:var(--grey-1);font-size:11.5px;cursor:pointer;transition:all .18s;white-space:nowrap;font-family:var(--font-main);letter-spacing:.02em}
.quick-reply-btn:hover,.quick-reply-btn:active{border-color:var(--accent);color:var(--white);background:var(--accent-glow)}

/* INPUT */
.chatbot-input-row{display:flex;gap:8px;padding:10px 16px;padding-bottom:calc(10px + var(--safe-bottom));background:var(--bg-1);border-top:1px solid var(--bg-3);flex-shrink:0}
.chatbot-input{flex:1;background:var(--bg-2);border:1px solid var(--bg-4);border-radius:22px;padding:10px 16px;color:var(--white);font-size:13.5px;outline:none;transition:border-color .2s;font-family:var(--font-main)}
.chatbot-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.chatbot-input::placeholder{color: var(--grey-1)}
.chatbot-send{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:var(--bg-0);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s;flex-shrink:0}
.chatbot-send:active{transform:scale(.9)}
.chatbot-send:disabled{background:var(--bg-4);color: var(--grey-1);cursor:default}
.chatbot-send svg{width:18px;height:18px}

/* The live catalogue is authoritative: refresh the card map from it on load,
   so a robot added in the CMS gets a card without editing this file. */
async function loadRobotCards(){
  try{
    const res=await fetch('/api/catalogue',{cache:'no-store'});
    if(!res.ok)return;
    const data=await res.json();
    const map={};
    (data.robots||[]).forEach(r=>{
      if(!r.slug)return;
      const image=r.image||'';
      map[r.slug]={name:r.name||r.slug,
                   maker:(ROBOT_CARDS[r.slug]&&ROBOT_CARDS[r.slug].maker)||'',
                   img:image?(image.startsWith('http')||image.startsWith('/')?image:'/'+image):'',
                   url:r.url||('products/'+r.slug+'.html'),
                   tags:[String(r.category||'robot').toUpperCase()]};
    });
    if(Object.keys(map).length)ROBOT_CARDS=map;
  }catch(e){/* keep the built-in map */}
}
loadRobotCards();

/* SVG robot head — matches the design Lareesa sent */
const RobotSVG = ()=>createElement('svg',{viewBox:'0 0 32 32',fill:'none',stroke:'#4AA8C8',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round',width:20,height:20},
  createElement('line',{x1:16,y1:3,x2:16,y2:7}),
  createElement('circle',{cx:16,cy:2.5,r:1.2,fill:'#4AA8C8',stroke:'none'}),
  createElement('rect',{x:5,y:7,width:22,height:16,rx:3}),
  createElement('rect',{x:9,y:11,width:4,height:4,rx:1}),
  createElement('rect',{x:19,y:11,width:4,height:4,rx:1}),
  createElement('path',{d:'M11 20 h10'}),
  createElement('rect',{x:13,y:23,width:6,height:3,rx:1}),
  createElement('line',{x1:3,y1:13,x2:5,y2:13}),
  createElement('line',{x1:27,y1:13,x2:29,y2:13})
);

/* Parse ||OPTIONS: ... || and ||CARD: ... || from message */
function parseTags(content){
  let cards=null, options=null, text=content;
  const cardIdx=text.indexOf('||CARD:');
  if(cardIdx!==-1){
    const cardEnd=text.indexOf('||',cardIdx+7);
    if(cardEnd!==-1){cards=text.slice(cardIdx+7,cardEnd).split('|').map(s=>s.trim()).filter(Boolean); text=(text.slice(0,cardIdx)+text.slice(cardEnd+2)).trim();}
  }
  const optIdx=text.indexOf('||OPTIONS:');
  if(optIdx!==-1){
    const optEnd=text.indexOf('||',optIdx+10);
    if(optEnd!==-1){options=text.slice(optIdx+10,optEnd).split('|').map(s=>s.trim()).filter(Boolean); text=(text.slice(0,optIdx)+text.slice(optEnd+2)).trim();}
  }
  /* Auto-detect robot names if no explicit CARD — longest name first so
     "MagicLab MagicDog Y1" never also matches the shorter "MagicLab MagicDog". */
  if(!cards){
    const lower=text.toLowerCase();
    const found=[];
    for(const [key,robot] of Object.entries(ROBOT_CARDS)){
      const name=(robot.name||'').toLowerCase();
      if(name&&lower.includes(name)) found.push({key,name:name});
    }
    found.sort((a,b)=>b.name.length-a.name.length);
    const picked=[];
    for(const f of found){
      if(picked.length>=3) break;
      if(picked.some(p=>ROBOT_CARDS[p].name.toLowerCase().includes(f.name))) continue;
      picked.push(f.key);
    }
    if(picked.length) cards=picked;
  }
  return {text, options, cards};
}

/* Send SVG icon matching Lareesa's design */
const SendSVG = ()=>createElement('svg',{viewBox:'0 0 24 24',width:18,height:18},
  createElement('line',{x1:22,y1:2,x2:11,y2:13,stroke:'currentColor',strokeWidth:2,strokeLinecap:'round'}),
  createElement('polygon',{points:'22 2 15 22 11 13 2 9 22 2',fill:'currentColor'})
);

function App(){
  const [messages,setMessages]=useState([{role:'assistant',content:OPENING,time:'Just now',options:null,cards:null}]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const msgRef=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{msgRef.current?.scrollTo(0,msgRef.current.scrollHeight)},[messages]);

  const send=useCallback(async(text)=>{
    const txt=(typeof text==='string'?text:input).trim();
    if(!txt||loading)return;
    const userMsg={role:'user',content:txt,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),options:null,cards:null};
    setMessages(prev=>[...prev,userMsg]);
    setInput('');setLoading(true);

    try{
      const res=await fetch(DEEPSEEK_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          messages:[
            {role:'system',content:SYSTEM_PROMPT},
            ...messages.filter(m=>m.role&&m.content).slice(-20).map(m=>({role:m.role,content:m.content})),
            {role:'user',content:txt}
          ],
          max_tokens:800,temperature:0.6,top_p:0.85
        })
      });
      const data=await res.json();
      const raw=data.choices?.[0]?.message?.content||'Hmm, give me just a moment.';
      const {text:clean,options,cards}=parseTags(raw);
      setMessages(prev=>[...prev,{role:'assistant',content:clean,options,cards,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}]);
    }catch(e){
      setMessages(prev=>[...prev,{role:'assistant',content:'Sorry, I hit a snag. Try again in a moment.',time:'',options:null,cards:null}]);
    }
    setLoading(false);
  },[input,loading,messages]);

  const handleChip=(txt)=>{send(txt);inputRef.current?.focus()};
  const handleOption=(opt)=>{send(opt);inputRef.current?.focus()};

  return createElement('div',{className:'chatbot-window'},
    /* HEADER */
    createElement('div',{className:'chatbot-header'},
      createElement('div',{className:'chatbot-avatar'},createElement(RobotSVG)),
      createElement('div',{className:'chatbot-header-info'},
        createElement('div',{className:'chatbot-name'},'Maxx · Your Robot Guide'),
        createElement('div',{className:'chatbot-status'},'Ready to help')
      )
    ),
    /* MESSAGES */
    createElement('div',{className:'chatbot-messages',ref:msgRef},
      messages.map((m,i)=>
        createElement('div',{key:i,className:'msg '+(m.role==='user'?'user':'bot')},
          createElement('div',{className:'msg-avatar'},createElement(RobotSVG)),
          createElement('div',null,
            createElement('div',{className:'msg-bubble'},m.content),
            m.options && createElement('div',{className:'msg-options'},
              m.options.map((opt,j)=>createElement('button',{key:j,className:'msg-option',onClick:()=>handleOption(opt)},opt))
            ),
            m.cards && createElement('div',{className:'msg-cards'},
              m.cards.map((key,j)=>{
                const r=ROBOT_CARDS[key];
                if(!r)return null;
                return createElement('a',{key:j,className:'robot-card',href:r.url,target:'_blank',rel:'noopener'},
                  createElement('div',{className:'robot-card-img'},r.img?createElement('img',{src:r.img,alt:r.name,loading:'lazy'}):createElement(RobotSVG)),
                  createElement('div',{className:'robot-card-info'},
                    createElement('div',{className:'robot-card-name'},r.name),
                    createElement('div',{className:'robot-card-tags'},(r.tags||[]).map((t,k)=>createElement('span',{key:k,className:'robot-card-tag'},t)))
                  ),
                  createElement('div',{className:'robot-card-arrow'},'→')
                );
              })
            ),
            m.time && createElement('div',{className:'msg-time'},m.time)
          )
        )
      ),
      /* Typing indicator */
      loading && createElement('div',{className:'typing-row'},
        createElement('div',{className:'msg-avatar',style:{display:'flex'}},createElement(RobotSVG)),
        createElement('div',{className:'chatbot-typing'},
          createElement('div',{className:'typing-dot'}),
          createElement('div',{className:'typing-dot'}),
          createElement('div',{className:'typing-dot'})
        )
      )
    ),
    /* Quick replies */
    messages.length<=1 && createElement('div',{className:'chatbot-quick-replies'},
      QUICK_CHIPS.map((c,i)=>createElement('button',{key:i,className:'quick-reply-btn',onClick:()=>handleChip(c)},c))
    ),
    /* Input */
    createElement('div',{className:'chatbot-input-row'},
      createElement('input',{
        ref:inputRef,className:'chatbot-input',value:input,
        onChange:e=>setInput(e.target.value),
        onKeyDown:e=>e.key==='Enter'&&send(),
        placeholder:'Ask about robots, pricing, or investing…',disabled:loading
      }),
      createElement('button',{className:'chatbot-send',onClick:()=>send(),disabled:!input.trim()||loading,children:createElement(SendSVG)})
    )
  );
}

createRoot(document.getElementById('root')).render(createElement(App));
</script>
</body>
</html>
