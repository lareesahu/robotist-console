<!-- Inquiry Modal -->
<div id="inquiry-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <button class="modal-close" onclick="closeInquiry()" aria-label="Close">&times;</button>
    <div class="inquiry-eyebrow">Send an Inquiry</div>
    <h2 class="inquiry-title">Tell us what you're<br><em>looking for.</em></h2>
    <p class="inquiry-desc">Share a few details and we'll get back to you within one business day.</p>
    <form class="inquiry-form">
      <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="inquiry-row">
        <div class="inquiry-field">
          <label for="m-name">Name</label>
          <input type="text" id="m-name" name="name" placeholder="Your full name" required>
        </div>
        <div class="inquiry-field">
          <label for="m-email">Email</label>
          <input type="email" id="m-email" name="email" placeholder="you@company.com" required>
        </div>
      </div>
      <div class="inquiry-row">
        <div class="inquiry-field">
          <label for="m-company">Company</label>
          <input type="text" id="m-company" name="company" placeholder="Your organisation">
        </div>
        <div class="inquiry-field">
          <label for="m-interest">Area of Interest</label>
          <select id="m-interest" name="interest">
            <option value="">Select an option</option>
            <option value="humanoid">Humanoid Robots</option>
            <option value="quadruped">Quadruped Robots</option>
            <option value="cleaning">Commercial Cleaning</option>
            <option value="industrial">Industrial Automation</option>
            <option value="multiple">Multiple Categories</option>
            <option value="rental">Rental / Trial</option>
            <option value="other">Other / General Inquiry</option>
          </select>
        </div>
      </div>
      <div class="inquiry-field">
        <label for="m-message">Message</label>
        <textarea id="m-message" name="message" placeholder="Tell us about your requirements, timeline, budget range, or any specific machines you're interested in…" required></textarea>
      </div>
      <div class="inquiry-submit-wrap">
        <button type="submit" class="btn-primary">Send Inquiry</button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/form-workflow.js"></script>
